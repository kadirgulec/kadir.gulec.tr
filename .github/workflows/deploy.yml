name: CI/CD

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEPLOY_HOST: server1.guelec.eu
  DEPLOY_USER: gulectr
  DEPLOY_PATH: web/kadir.gulec.tr/public_html
  DEPLOY_PHP: php8.4
  # The server's ED25519 host key, pinned so the deploy cannot be redirected.
  DEPLOY_KNOWN_HOST: server1.guelec.eu ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOeh8P+SOCuKob3VpuKw9d6S2aQBzqzPxo1kRBbzzhNb

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: kadir_gulec_tr_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: kadir_gulec_tr_testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Use the Turkish collation
        run: mysql -h 127.0.0.1 -uroot -ppassword -e "ALTER DATABASE kadir_gulec_tr_testing CHARACTER SET utf8mb4 COLLATE utf8mb4_tr_0900_ai_ci"

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

  deploy:
    needs: ci
    # Production only from master, never from pull requests.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    concurrency:
      group: deploy-production
      cancel-in-progress: false # never cancel a deploy mid-migrate

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction --no-progress

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOST" > ~/.ssh/known_hosts

      # .env, storage/ and the public/storage link live only on the server; rsync's
      # --delete leaves excluded paths alone.
      - name: Upload to the server
        run: |
          rsync -rlptz --delete \
            --exclude '/.git' --exclude '/.github' \
            --exclude '/.env' \
            --exclude '/storage' --exclude '/public/storage' \
            --exclude '/bootstrap/cache' \
            --exclude '/node_modules' \
            --exclude '/tests' --exclude '/*.md' \
            -e "ssh -4 -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Migrate and rebuild caches
        run: |
          ssh -4 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && PHP_BIN='$DEPLOY_PHP' bash deployment/remote.sh"
